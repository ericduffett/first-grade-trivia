<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fidelity Market</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #15803D;
    --green-dark: #0F5D2C;
    --green-light: #DCFCE7;
    --red: #DC2626;
    --red-light: #FEE2E2;
    --gray: #4A4A6A;
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --text-dark: #1A1A2E;
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.18);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Nunito Sans', sans-serif;
    color: var(--text-dark);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(21,128,61,0.10) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(21,128,61,0.08) 0%, transparent 45%);
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 40px;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .header h1 .accent { color: var(--green); }
  .header p {
    margin-top: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--gray);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Price card */
  .price-card {
    background: var(--card);
    border-radius: 32px;
    box-shadow: var(--shadow-lg);
    padding: 64px 80px 56px;
    width: 100%;
    max-width: 720px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: background 0.4s ease;
  }
  .price-card.flash-up   { background: var(--green-light); }
  .price-card.flash-down { background: var(--red-light); }
  .price-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: var(--green);
  }

  .label {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 12px;
  }

  .price {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 220px;
    line-height: 1;
    color: var(--text-dark);
    transition: transform 0.4s cubic-bezier(.4,0,.2,1), color 0.4s;
    letter-spacing: -4px;
  }
  .price.bump { transform: scale(1.08); }
  .price.up   { color: var(--green); }
  .price.down { color: var(--red); }

  .change {
    margin-top: 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 32px;
    min-height: 40px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .change.visible { opacity: 1; }
  .change.up   { color: var(--green); }
  .change.down { color: var(--red); }
  .change.flat { color: var(--gray); }
  .change .roll {
    display: inline-block;
    background: rgba(0,0,0,0.06);
    color: var(--text-dark);
    border-radius: 10px;
    padding: 4px 12px;
    font-size: 22px;
    margin-left: 12px;
    vertical-align: middle;
  }

  /* Timer */
  .timer-wrap {
    margin-top: 36px;
    width: 100%;
    max-width: 720px;
    text-align: center;
  }
  .timer {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 64px;
    color: var(--text-dark);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .timer-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 4px;
  }
  .progress-wrap {
    margin-top: 16px;
    height: 14px;
    width: 100%;
    background: rgba(0,0,0,0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), #4ADE80);
    border-radius: 99px;
    transition: width 0.2s linear;
  }

  /* Start button */
  .start-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,249,240,0.96);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 32px;
  }
  .start-overlay.hidden { display: none; }
  .start-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 56px;
    color: var(--text-dark);
    letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .start-title .accent { color: var(--green); }
  .start-sub {
    font-size: 20px;
    font-weight: 600;
    color: var(--gray);
    margin-bottom: 40px;
    max-width: 460px;
  }
  .btn-start {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 22px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 28px;
    padding: 26px 64px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(21,128,61,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-start:active {
    transform: scale(0.96);
    box-shadow: 0 4px 14px rgba(21,128,61,0.3);
  }

  /* Tablet/phone tweaks */
  @media (max-width: 700px) {
    .header h1 { font-size: 32px; }
    .price-card { padding: 44px 28px 40px; border-radius: 24px; }
    .price { font-size: 140px; letter-spacing: -3px; }
    .change { font-size: 24px; }
    .change .roll { font-size: 18px; }
    .timer { font-size: 48px; }
    .start-title { font-size: 40px; }
    .start-sub { font-size: 16px; }
    .btn-start { font-size: 22px; padding: 20px 44px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Fidelity <span class="accent">Market</span></h1>
  <p>Live price updates every 2 minutes</p>
</div>

<div class="price-card" id="priceCard">
  <div class="label">Current Share Price</div>
  <div class="price" id="price">$5</div>
  <div class="change" id="change"></div>
</div>

<div class="timer-wrap">
  <div class="timer-label">Next roll in</div>
  <div class="timer" id="timer">2:00</div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill" style="width:100%"></div>
  </div>
</div>

<div class="start-overlay" id="startOverlay">
  <div class="start-title">Fidelity <span class="accent">Market</span></div>
  <div class="start-sub">Press start to open the market. The price updates every 2 minutes based on a die roll. Floor: $2.</div>
  <button class="btn-start" onclick="startMarket()">Start Market &#9654;</button>
</div>

<script>
  const PERIOD_MS = 2 * 60 * 1000;   // 2 minutes
  const FLOOR = 2;
  // Delta table — index 0 unused
  const DELTAS = [null, -2, -1, 0, +1, +3, +5];

  let price = 5;
  let timerEnd = 0;
  let tickHandle = null;

  const $ = (id) => document.getElementById(id);

  function fmtTime(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(t / 60);
    const s = t % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function updateTimer() {
    const remaining = timerEnd - Date.now();
    $('timer').textContent = fmtTime(remaining);
    const pct = Math.max(0, Math.min(100, (remaining / PERIOD_MS) * 100));
    $('progressFill').style.width = pct + '%';
    if (remaining <= 0) {
      rollAndApply();
      timerEnd = Date.now() + PERIOD_MS;
    }
  }

  function rollAndApply() {
    const roll = 1 + Math.floor(Math.random() * 6);
    const rawDelta = DELTAS[roll];
    const oldPrice = price;
    let newPrice = oldPrice + rawDelta;
    if (newPrice < FLOOR) newPrice = FLOOR;
    const actualDelta = newPrice - oldPrice;
    price = newPrice;

    // Update price display
    const priceEl = $('price');
    priceEl.textContent = '$' + price;
    priceEl.classList.remove('up', 'down', 'bump');
    void priceEl.offsetWidth; // restart animation
    priceEl.classList.add('bump');
    if (actualDelta > 0) priceEl.classList.add('up');
    else if (actualDelta < 0) priceEl.classList.add('down');

    // Change indicator
    const changeEl = $('change');
    let txt, cls;
    if (actualDelta > 0)      { txt = '▲ +$' + actualDelta;  cls = 'up'; }
    else if (actualDelta < 0) { txt = '▼ −$' + Math.abs(actualDelta); cls = 'down'; }
    else                       { txt = 'No change';                cls = 'flat'; }
    changeEl.className = 'change visible ' + cls;
    changeEl.innerHTML = txt + '<span class="roll">Rolled ' + roll + '</span>';

    // Card flash
    const card = $('priceCard');
    card.classList.remove('flash-up', 'flash-down');
    if (actualDelta > 0) card.classList.add('flash-up');
    else if (actualDelta < 0) card.classList.add('flash-down');
    setTimeout(() => {
      card.classList.remove('flash-up', 'flash-down');
      priceEl.classList.remove('bump');
    }, 1200);
    // Keep "up"/"down" color a bit longer, then fade
    setTimeout(() => {
      priceEl.classList.remove('up', 'down');
    }, 8000);
  }

  function startMarket() {
    $('startOverlay').classList.add('hidden');
    timerEnd = Date.now() + PERIOD_MS;
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(updateTimer, 100);
    updateTimer();
  }

  // Pre-fill timer text before start
  $('timer').textContent = fmtTime(PERIOD_MS);
</script>
</body>
</html>
